plugins {
    id 'base'
}

registerVersionBuild('buildForge', '1.20.1')
registerVersionBuild('buildNeoForge', '1.21.1')

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft version.'
    dependsOn 'buildForge', 'buildNeoForge'
}

tasks.named('build') {
    dependsOn 'buildForge'
}
